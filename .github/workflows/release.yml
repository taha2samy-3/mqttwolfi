name: Release

# Publish a release:   git tag -a v0.5.0 -m "WolfiMQ v0.5.0" && git push origin v0.5.0
# or run this workflow manually with an existing tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      fips: ${{ steps.fips.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: tag
        name: Check that the tag matches Cargo.toml
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      # Secrets cannot be used in job-level `if`, so their presence is exported here.
      - id: fips
        name: Check for the FIPS bundle secret
        env:
          HAS_FIPS: ${{ secrets.WOLFSSL_FIPS_BUNDLE_B64 != '' }}
        run: |
          echo "available=${HAS_FIPS}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_FIPS}" != "true" ]; then
            echo "::notice title=No FIPS build::WOLFSSL_FIPS_BUNDLE_B64 is not set; the FIPS-Ready variant is skipped."
          fi

  test:
    name: Test before release
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake openssl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --bins --tests

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc). The suffix pins the minimum glibc so binaries run on old distros.
          - { name: linux-x86_64,        os: ubuntu-latest, target: x86_64-unknown-linux-gnu,      zig: x86_64-unknown-linux-gnu.2.17 }
          - { name: linux-aarch64,       os: ubuntu-latest, target: aarch64-unknown-linux-gnu,     zig: aarch64-unknown-linux-gnu.2.17 }
          - { name: linux-armv7,         os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, zig: armv7-unknown-linux-gnueabihf.2.17 }
          - { name: linux-riscv64,       os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu,   zig: riscv64gc-unknown-linux-gnu.2.27 }
          # Linux (musl): fully static binaries.
          - { name: linux-x86_64-musl,   os: ubuntu-latest, target: x86_64-unknown-linux-musl,     zig: x86_64-unknown-linux-musl }
          - { name: linux-aarch64-musl,  os: ubuntu-latest, target: aarch64-unknown-linux-musl,    zig: aarch64-unknown-linux-musl }
          # Windows (MinGW ABI, cross-compiled).
          - { name: windows-x86_64,      os: ubuntu-latest, target: x86_64-pc-windows-gnu,         zig: x86_64-pc-windows-gnu }
          # macOS (native toolchain).
          - { name: macos-aarch64,       os: macos-latest,  target: aarch64-apple-darwin }
          - { name: macos-x86_64,        os: macos-latest,  target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive
      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          pip install ziglang==0.14.1
          cargo install cargo-zigbuild --locked
      - name: Build (zig cross toolchain)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.zig }} --bins
      - name: Build (native toolchain)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          PKG="wolfimq-${{ needs.prepare.outputs.version }}-${{ matrix.name }}"
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          mkdir -p "${PKG}/bin" "${PKG}/config" "${PKG}/scripts" "${PKG}/docs"
          for b in wolf-broker wolf-simulate wolf-bench-tls; do
            cp "target/${{ matrix.target }}/release/${b}${EXT}" "${PKG}/bin/"
          done
          cp config/broker.toml config/acl.conf "${PKG}/config/"
          cp scripts/generate_certs.sh "${PKG}/scripts/"
          cp docs/*.md "${PKG}/docs/"
          cp README.md CHANGELOG.md SECURITY.md LICENSE LICENSE-MIT LICENSE-APACHE "${PKG}/"
          # The binaries statically link wolfSSL (GPLv3): ship its license texts.
          mkdir -p "${PKG}/third-party/wolfssl"
          cp external/wolfssl/COPYING external/wolfssl/LICENSING "${PKG}/third-party/wolfssl/"
          if [[ -n "${EXT}" ]]; then
            7z a -tzip "${PKG}.zip" "${PKG}" >/dev/null
            ARCHIVE="${PKG}.zip"
          else
            tar -czf "${PKG}.tar.gz" "${PKG}"
            ARCHIVE="${PKG}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"; else shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            wolfimq-*.tar.gz
            wolfimq-*.zip
            wolfimq-*.sha256

  build-fips:
    name: Build linux-x86_64 FIPS-Ready
    needs: [prepare, test]
    # Shown as "skipped" unless the FIPS-Ready bundle secret is configured.
    if: needs.prepare.outputs.fips == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake libtool
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore bundle and build
        env:
          WOLFSSL_FIPS_BUNDLE_B64: ${{ secrets.WOLFSSL_FIPS_BUNDLE_B64 }}
        run: |
          echo "${WOLFSSL_FIPS_BUNDLE_B64}" | base64 -d | tar -xz -C .
          cargo build --release --no-default-features --features wolfssl-fips --bins
          PKG="wolfimq-${{ needs.prepare.outputs.version }}-linux-x86_64-fips-ready"
          mkdir -p "${PKG}/bin" "${PKG}/config"
          cp target/release/wolf-broker target/release/wolf-simulate target/release/wolf-bench-tls "${PKG}/bin/"
          cp config/broker.toml config/acl.conf "${PKG}/config/"
          cp README.md SECURITY.md LICENSE LICENSE-MIT LICENSE-APACHE "${PKG}/"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-fips
          path: wolfimq-*

  benchmarks:
    name: Benchmarks
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake openssl mosquitto
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - run: bash scripts/ci_benchmarks.sh BENCHMARKS.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BENCHMARKS.md

  publish:
    name: Publish GitHub release
    needs: [prepare, build, build-fips, benchmarks]
    # build-fips is usually skipped; publish as long as nothing failed.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.benchmarks.result == 'success'
      && (needs.build-fips.result == 'success' || needs.build-fips.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble release notes
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cd ..
          VERSION="${{ needs.prepare.outputs.version }}"
          # Section of CHANGELOG.md for this version.
          awk -v v="${VERSION}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Archive |"
            echo "| :--- | :--- |"
            for f in artifacts/wolfimq-*.tar.gz artifacts/wolfimq-*.zip; do
              [ -e "$f" ] || continue
              name="$(basename "$f")"
              platform="${name#wolfimq-${VERSION}-}"; platform="${platform%.tar.gz}"; platform="${platform%.zip}"
              echo "| ${platform} | \`${name}\` |"
            done
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS.txt\`."
            echo
            cat artifacts/BENCHMARKS.md
          } >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: WolfiMQ ${{ needs.prepare.outputs.tag }}
          body_path: notes.md
          files: |
            artifacts/wolfimq-*
            artifacts/SHA256SUMS.txt
            artifacts/BENCHMARKS.md
