name: Release & Multi-Architecture Binary Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Version Tag (e.g., v0.1.0)"
        required: false
        default: "v0.1.0"
      draft:
        description: "Create Draft Release (not published immediately)"
        type: boolean
        default: false
      prerelease:
        description: "Mark as Pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-binaries:
    name: Build ${{ matrix.arch }} (${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 (x86_64) - Standard wolfSSL TLS 1.3
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            flavor: wolfssl
            features: "wolfssl"
            os: ubuntu-latest

          # AMD64 (x86_64) - wolfSSL FIPS 140-2/3 Validated Cryptography
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            flavor: wolfssl-fips
            features: "wolfssl-fips"
            os: ubuntu-latest

          # ARM64 (aarch64) - Standard wolfSSL TLS 1.3
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            flavor: wolfssl
            features: "wolfssl"
            os: ubuntu-latest

          # ARM64 (aarch64) - wolfSSL FIPS 140-2/3 Validated Cryptography
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            flavor: wolfssl-fips
            features: "wolfssl-fips"
            os: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Toolchain (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building WolfiMQ for release tag: ${TAG}"

      - name: Compile Optimized Release Binaries
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      - name: Package Release Distribution Archive
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PKG_NAME="wolfimq-${TAG}-linux-${{ matrix.arch }}-${{ matrix.flavor }}"
          mkdir -p "${PKG_NAME}/bin" "${PKG_NAME}/config" "${PKG_NAME}/scripts" "${PKG_NAME}/docs"

          # Copy compiled binaries
          cp "target/${{ matrix.target }}/release/wolf-broker" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/wolf-bench-tls" "${PKG_NAME}/bin/"

          # Copy configuration files and templates
          cp "config/broker.toml" "${PKG_NAME}/config/"
          cp "config/acl.conf" "${PKG_NAME}/config/"

          # Copy operational scripts and documentation
          cp "scripts/generate_certs.sh" "${PKG_NAME}/scripts/"
          cp "docs/CONFIGURATION_AND_CONTROL.md" "${PKG_NAME}/docs/"
          cp "README.md" "${PKG_NAME}/"
          cp "LICENSE" "${PKG_NAME}/"

          # Ensure scripts are executable
          chmod +x "${PKG_NAME}/scripts/"*.sh

          # Create compressed tarball
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"

          # Compute SHA-256 checksum
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfimq-${{ matrix.arch }}-${{ matrix.flavor }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          retention-days: 2

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate SHA256 Checksums
        id: checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          echo "=== Release Package Checksums ==="
          cat SHA256SUMS.txt
          cd ..

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "WolfiMQ ${{ steps.vars.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS.txt
          body: |
            ## 🐺 WolfiMQ Official Release Distribution

            High-performance, memory-safe MQTT 3.1.1 & 5.0 broker with native **wolfSSL TLS 1.3** and **wolfSSL FIPS 140-2/3 Validated Cryptographic Module** support.

            ### 📦 Multi-Architecture Binary Matrix
            | Archive File | Target Architecture | Cryptographic Engine | FIPS 140-2/3 |
            | :--- | :--- | :--- | :---: |
            | `wolfimq-${{ steps.vars.outputs.tag }}-linux-amd64-wolfssl.tar.gz` | Linux x86_64 (AMD64) | wolfSSL TLS 1.3 / mTLS Standard | ❌ |
            | `wolfimq-${{ steps.vars.outputs.tag }}-linux-amd64-wolfssl-fips.tar.gz` | Linux x86_64 (AMD64) | wolfSSL FIPS 140-2/3 Cryptographic Module | ✅ |
            | `wolfimq-${{ steps.vars.outputs.tag }}-linux-arm64-wolfssl.tar.gz` | Linux aarch64 (ARM64) | wolfSSL TLS 1.3 / mTLS Standard | ❌ |
            | `wolfimq-${{ steps.vars.outputs.tag }}-linux-arm64-wolfssl-fips.tar.gz` | Linux aarch64 (ARM64) | wolfSSL FIPS 140-2/3 Cryptographic Module | ✅ |
            | `SHA256SUMS.txt` | All Packages | Consolidated SHA256 Checksums | — |

            ### 🚀 Quick Installation & Startup

            ```bash
            # 1. Download and extract the archive for your architecture
            tar -xzvf wolfimq-${{ steps.vars.outputs.tag }}-linux-amd64-wolfssl.tar.gz
            cd wolfimq-${{ steps.vars.outputs.tag }}-linux-amd64-wolfssl/

            # 2. (Optional) Generate local mTLS test certificates
            bash scripts/generate_certs.sh

            # 3. Launch WolfiMQ with custom or default configuration
            ./bin/wolf-broker --config config/broker.toml
            ```

            ### 🔒 Verifying Cryptographic Flavor

            To verify whether your binary was built with standard wolfSSL or FIPS validated cryptography:
            ```bash
            ./bin/wolf-broker --version
            ```
            - Standard: `wolf-mqtt-broker v0.1.0 (wolfSSL TLS 1.3 / mTLS)`
            - FIPS 140-2/3: `wolf-mqtt-broker v0.1.0 (wolfSSL FIPS 140-2/3 Validated Cryptographic Module - TLS 1.3 / mTLS)`
