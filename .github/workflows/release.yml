name: Release - Publish Binaries

# Triggered by: git tag v0.3.2 && git push --tags
# Or manually via GitHub Actions UI (Actions -> Release -> Run workflow)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.3.2)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Standard Release (wolfSSL open-source, full cipher suite)
  # ─────────────────────────────────────────────────────────────────────────────
  build-standard:
    name: Build - wolfSSL Standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-standard

      - name: Build Release Binaries (Standard)
        run: |
          cargo build --release --bin wolf-broker --features wolfssl
          cargo build --release --bin wolf-bench-tls --features wolfssl

      - name: Package Standard Release
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          PKG="wolfimq-v${VERSION}-linux-amd64-wolfssl"
          mkdir -p "${PKG}/bin" "${PKG}/config" "${PKG}/scripts" "${PKG}/docs"

          cp target/release/wolf-broker target/release/wolf-bench-tls "${PKG}/bin/"
          cp config/broker.toml config/acl.conf "${PKG}/config/"
          cp scripts/generate_certs.sh "${PKG}/scripts/"
          cp README.md LICENSE CHANGELOG.md "${PKG}/"
          cp docs/CONFIGURATION_AND_CONTROL.md "${PKG}/docs/" 2>/dev/null || true

          VERSION_TAG=${VERSION}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "${PKG}/BUILD-INFO.txt" << BUILDEOF
          WolfiMQ Standard Release - wolfSSL Open-Source
          ================================================
          Version : v${VERSION_TAG}
          Variant : Standard (full cipher suite)
          wolfSSL : Open-source (github.com/wolfSSL/wolfssl)
          TLS     : TLS 1.3 with AES-GCM, ChaCha20-Poly1305, ECDH
          Build   : Release (LTO fat, codegen-units=1)
          Platform: Linux x86_64
          Date    : ${BUILD_DATE}
          BUILDEOF

          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "Packaged: ${PKG}.tar.gz"
          cat "${PKG}.tar.gz.sha256"

      - name: Upload Standard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfssl-standard
          path: |
            *.tar.gz
            *.tar.gz.sha256

  # ─────────────────────────────────────────────────────────────────────────────
  # Build FIPS-Ready Release
  # Skipped gracefully if WOLFSSL_FIPS_BUNDLE_B64 secret is not set.
  # To enable: add the base64-encoded FIPS bundle as a repo secret.
  #   tar -czf bundle.tar.gz external/wolfssl-fips-bundle/
  #   base64 -w0 bundle.tar.gz
  #   -> paste as WOLFSSL_FIPS_BUNDLE_B64 in Settings -> Secrets -> Actions
  # ─────────────────────────────────────────────────────────────────────────────
  build-fips:
    name: Build - wolfSSL FIPS-Ready
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.fips_check.outputs.available }}
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-fips

      - name: Check FIPS Bundle Secret
        id: fips_check
        env:
          HAS_FIPS: ${{ secrets.WOLFSSL_FIPS_BUNDLE_B64 != '' }}
        run: |
          if [ "${HAS_FIPS}" = "true" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "FIPS bundle secret is configured - will build FIPS-Ready variant"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice title=FIPS Build Skipped::WOLFSSL_FIPS_BUNDLE_B64 secret not set. Only the standard release will be published. See README for FIPS setup."
          fi

      - name: Restore FIPS Bundle
        if: steps.fips_check.outputs.available == 'true'
        env:
          WOLFSSL_FIPS_BUNDLE_B64: ${{ secrets.WOLFSSL_FIPS_BUNDLE_B64 }}
        run: |
          echo "${WOLFSSL_FIPS_BUNDLE_B64}" | base64 -d | tar -xz -C .
          ls external/wolfssl-fips-bundle/CMakeLists.txt

      - name: Build Release Binaries (FIPS-Ready)
        if: steps.fips_check.outputs.available == 'true'
        run: |
          cargo build --release --bin wolf-broker --no-default-features --features wolfssl-fips
          cargo build --release --bin wolf-bench-tls --no-default-features --features wolfssl-fips

      - name: Package FIPS-Ready Release
        if: steps.fips_check.outputs.available == 'true'
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          PKG="wolfimq-v${VERSION}-linux-amd64-wolfssl-fips-ready"
          mkdir -p "${PKG}/bin" "${PKG}/config" "${PKG}/scripts" "${PKG}/docs"

          cp target/release/wolf-broker target/release/wolf-bench-tls "${PKG}/bin/"
          cp config/broker.toml config/acl.conf "${PKG}/config/"
          cp scripts/generate_certs.sh "${PKG}/scripts/"
          cp README.md LICENSE CHANGELOG.md "${PKG}/"
          cp docs/CONFIGURATION_AND_CONTROL.md "${PKG}/docs/" 2>/dev/null || true

          cat > "${PKG}/FIPS-NOTICE.txt" << 'FIPSEOF'
          WolfiMQ FIPS-Ready Build
          ========================
          Algorithms ALLOWED (FIPS 140-2/3 approved):
            AES-128/256-CBC, AES-128/256-GCM
            SHA-224/256/384/512, SHA3-224/256/384/512
            RSA 2048/3072/4096, ECDSA/ECDH P-256/P-384/P-521
            HMAC-SHA-2, Hash-DRBG (SP 800-90A)

          Algorithms REMOVED (non-FIPS):
            ChaCha20-Poly1305, MD5, DES, 3DES, RC4

          NOTE: "FIPS-Ready" = FIPS-approved algorithms only, no formal CMVP cert.
          For a formally validated build (CMVP #4718):
            https://www.wolfssl.com/products/wolfcrypt-fips/
          FIPSEOF

          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "Packaged: ${PKG}.tar.gz"

      - name: Upload FIPS-Ready Artifact
        if: steps.fips_check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wolfssl-fips-ready
          path: |
            *.tar.gz
            *.tar.gz.sha256

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release with all artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-standard, build-fips]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: List Release Files
        run: ls -lh release-artifacts/

      - name: Determine Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Extract Release Notes from CHANGELOG
        run: |
          awk '/^## \[/{found++} found==1{print} found==2{exit}' CHANGELOG.md \
            | tail -n +2 > release-notes.md
          cat >> release-notes.md << 'RNEOF'

          ---
          ## Release Artifacts

          | File | Description |
          |------|-------------|
          | `wolfimq-*-wolfssl.tar.gz` | Standard build - full TLS 1.3 cipher suite |
          | `wolfimq-*-wolfssl-fips-ready.tar.gz` | FIPS-Ready build - FIPS 140-2/3 algorithms only |
          | `*.sha256` | SHA-256 checksums for integrity verification |

          ## Verify Checksums
          ```bash
          sha256sum -c wolfimq-*.sha256
          ```
          RNEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "WolfiMQ ${{ env.RELEASE_TAG }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
