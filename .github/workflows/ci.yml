name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Code Quality (format + clippy)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-format:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Code Formatting
        run: task fmt

      - name: Run Clippy Linter (standard wolfSSL only)
        run: task lint

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Standard Tests (always runs)
  # ─────────────────────────────────────────────────────────────────────────────
  test-standard:
    name: Tests - wolfSSL Standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Testing Certificates (mTLS)
        run: task certs:gen

      - name: Run All Tests (Standard wolfSSL)
        run: cargo test --test '*' -- --test-threads=4

      - name: Run E2E Network Tests
        run: cargo test --test test_e2e_network -- --nocapture

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: FIPS-Ready Tests (only when FIPS bundle secret is available)
  # ─────────────────────────────────────────────────────────────────────────────
  test-fips:
    name: Tests - wolfSSL FIPS-Ready
    runs-on: ubuntu-latest
    # Only run when the FIPS bundle secret is configured
    if: ${{ secrets.WOLFSSL_FIPS_BUNDLE_B64 != '' }}
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fips

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore FIPS Bundle
        env:
          WOLFSSL_FIPS_BUNDLE_B64: ${{ secrets.WOLFSSL_FIPS_BUNDLE_B64 }}
        run: echo "${WOLFSSL_FIPS_BUNDLE_B64}" | base64 -d | tar -xz -C .

      - name: Generate Testing Certificates (mTLS)
        run: task certs:gen

      - name: Run All Tests (FIPS-Ready wolfSSL)
        run: cargo test --test '*' --no-default-features --features wolfssl-fips -- --test-threads=4

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Performance Benchmarks
  # ─────────────────────────────────────────────────────────────────────────────
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute High-Precision Benchmarks
        run: task bench

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Comparative TLS Benchmarks
  # ─────────────────────────────────────────────────────────────────────────────
  comparative-tls-benchmarks:
    name: Comparative TLS Benchmarks (WolfiMQ vs Mosquitto)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential mosquitto mosquitto-clients openssl

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate mTLS Test Certificates
        run: task certs:gen

      - name: Execute Comparative TLS Benchmark
        run: task bench:tls:compare
