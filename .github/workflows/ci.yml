name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-format:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Check Code Formatting
        run: task fmt

      - name: Run Clippy Linter
        run: task lint

  test-suite:
    name: Unit, Integration & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Generate Testing Certificates (mTLS)
        run: task certs:gen

      - name: Run Unit Tests (Packet Parser & Variables)
        run: task test:unit

      - name: Run Integration Tests (Session & Topic Routing)
        run: task test:integration

      - name: Run Live TCP Socket E2E Network Tests
        run: task test:e2e

  benchmarks:
    name: Release Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Execute High-Precision Benchmarks
        run: task bench

  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  comparative-tls-benchmarks:
    name: Comparative TLS Benchmarks (WolfiMQ vs Mosquitto)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Task Runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Eclipse Mosquitto & OpenSSL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto mosquitto-clients openssl

      - name: Generate mTLS Test Certificates
        run: task certs:gen

      - name: Execute Comparative TLS Benchmark (WolfiMQ vs Mosquitto)
        run: task bench:tls:compare

