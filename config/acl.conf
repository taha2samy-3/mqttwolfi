# ==============================================================================
# WolfiMQ Access Control List (ACL) Configuration
# ==============================================================================
#
# Syntax Specification:
#   user <username>
#   topic [read|write|readwrite] <topic_filter>
#
# Patterns support MQTT standard wildcards:
#   '+' matches a single topic level
#   '#' matches multiple topic levels (must be at the end)
#   '%u' is substituted with the client's authenticated username
#   '%c' is substituted with the client's MQTT ClientID
#
# ==============================================================================

# Anonymous / Unauthenticated Clients (if allow_anonymous = true)
user anonymous
topic read public/#
topic write public/telemetry/+

# Sensor Fleet User
user sensor_node
topic write sensors/%c/data
topic read sensors/%c/commands

# Operations & Monitoring
user monitor_admin
topic readwrite #
topic read $SYS/#

# Edge Gateway Services
user edge_gateway
topic readwrite factory/lines/+/telemetry
topic read factory/control/#
