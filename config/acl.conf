# ==============================================================================
# WolfiMQ Access Control List (ACL) & Role-Based Access Control (RBAC)
# ==============================================================================
# ⚠️  SECURITY WARNING: This is a TEMPLATE configuration. You MUST replace ALL
#    password values before deploying. Never commit real credentials to source
#    control. Use `password_hash:` with pre-hashed Argon2id strings instead of
#    `password:` for production deployments.
#
#    Generate an Argon2id hash:
#      wolf-broker --hash-password <your-password>
#
# User Declaration Syntax:
#   user <username> [password:<pass>] [password_hash:<argon2id>] [role:<role>] [rooms:<r1,r2,...>]
#
# Supported Roles:
#   - admin      : Full universal control (#, $SYS/#) across all rooms and system topics
#   - moderator  : Full management (rooms/%r/#, users/%u/#) over assigned rooms
#   - member     : Standard room participant (rooms/%r/chat, rooms/%r/presence, read announcements)
#   - viewer     : Read-only room observer (rooms/%r/chat [read], announcements [read], no publish)
#   - device     : IoT hardware scoped strictly to devices/%c/telemetry and devices/%c/commands
#   - custom     : User with custom explicit rules defined below the user line
#
# Topic Rule Syntax:
#   topic [read|write|readwrite|deny] <topic_pattern>
#   pattern [read|write|readwrite|deny] <topic_pattern>
#
# Topic Pattern Substitution Macros:
#   - '%u' : Substituted dynamically with the authenticated username
#   - '%c' : Substituted dynamically with the connecting client's MQTT ClientID
#   - '%r' : Substituted dynamically across all allowed rooms assigned to the user
#   - '+'  : Standard MQTT single-level wildcard
#   - '#'  : Standard MQTT multi-level wildcard (must be final segment)
#
# Permission Levels:
#   - read      : Permitted to SUBSCRIBE and receive messages
#   - write     : Permitted to PUBLISH messages
#   - readwrite : Permitted to both PUBLISH and SUBSCRIBE
#   - deny      : Explicitly forbidden (takes immediate precedence over broad wildcards)
#
# ==============================================================================

# 1. System Administrator (Universal Access)
user superadmin password:admin_secret_pass role:admin rooms:*
topic readwrite #
topic read $SYS/#

# 2. Room Moderators (Management over 'engineering' and 'operations' rooms)
user ops_lead password:moderator_password role:moderator rooms:engineering,operations
topic readwrite rooms/%r/#
topic readwrite rooms/%r/admin/control
topic readwrite users/%u/#

# 3. Room Members (Interactive Chat & Presence in 'engineering')
user dev_sarah password:sarah_dev_pass role:member rooms:engineering
topic readwrite rooms/%r/chat
topic readwrite rooms/%r/presence
topic read rooms/%r/announcements
topic deny rooms/%r/admin/#
topic readwrite users/%u/private

# 4. Room Members (Interactive Chat in 'operations')
user ops_alex password:alex_ops_pass role:member rooms:operations
topic readwrite rooms/%r/chat
topic readwrite rooms/%r/presence
topic read rooms/%r/announcements
topic deny rooms/%r/admin/#

# 5. Room Viewers (Read-Only in 'operations')
user guest_auditor password:auditor_pass role:viewer rooms:operations
topic read rooms/%r/chat
topic read rooms/%r/announcements
topic deny rooms/%r/#

# 6. Constrained IoT Fleet (Strict ClientID Pattern Scoping via %c)
# A device can only publish telemetry to its own topic and receive commands targeted to its ID.
user sensor_node password:sensor_token_77 role:device
topic write devices/%c/telemetry
topic read devices/%c/commands
topic deny #

# 7. Anonymous / Public Access
# NOTE: This section is ONLY active when allow_anonymous = true in broker.toml.
# Default: allow_anonymous = false (anonymous connections are rejected).
# These rules have NO EFFECT when allow_anonymous = false.
# When enabled, anonymous clients are restricted to read-only access on public/# only.
user anonymous
topic read public/#
topic deny #
