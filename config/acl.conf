# ==============================================================================
# WolfiMQ Access Control List (ACL) & Role-Based Access Control (RBAC)
# ==============================================================================
# SECURITY WARNING: this is a TEMPLATE. Replace every password before deploying and
# prefer `password_hash:` over plaintext `password:` (the broker warns about the latter).
#
#   Generate a hash:   wolf-broker --hash-password            (reads the password from stdin)
#   Reload this file:  kill -HUP <broker pid>                 (atomic; a bad file is rejected)
#
# User declaration:
#   user <username> [password:<pass>] [password_hash:<hash>] [role:<role>] [rooms:<r1,r2,...>]
#   A user without a password (or hash) can never log in over MQTT; such accounts are useful
#   as identities for MQTT-SN clients (listeners.mqtt_sn.acl_user) or for "anonymous".
#
# Roles and their built-in rules (applied AFTER the rules listed under the user):
#   admin      : unrestricted; ACL checks are bypassed
#   moderator  : readwrite rooms/%r/#, readwrite users/%u/#
#   member     : deny rooms/%r/admin/#, readwrite rooms/%r/chat, rooms/%r/presence,
#                read rooms/%r/announcements, readwrite users/%u/private
#   viewer     : read rooms/%r/chat, read rooms/%r/announcements, deny rooms/%r/#
#   device     : write devices/%c/telemetry, read devices/%c/commands, deny #
#                (the user name must equal the MQTT ClientID)
#   (none)     : custom; only the rules listed under the user apply
#
# Rules:
#   topic <read|write|readwrite|deny> <pattern>      ("pattern" is accepted as a synonym)
#   Macros: %u = user name, %c = ClientID, %r = each of the user's rooms ("*" = all rooms).
#   Macros are replaced in one pass. A user name or ClientID containing '+', '#', '/' or '%'
#   cannot be substituted: an allow rule using it then never matches and a deny rule using it
#   always matches, so such values can never widen access.
#
# Evaluation: FIRST MATCHING RULE WINS (like firewall rules).
#   - PUBLISH is allowed by the first rule matching the topic that grants write.
#   - SUBSCRIBE is allowed by the first rule whose pattern covers the whole filter with
#     read access; an earlier deny rule that overlaps the filter rejects it.
#   Put specific deny rules before broader allow rules. Anything unmatched is denied.
# ==============================================================================

# 1. System administrator (unrestricted)
user superadmin password:admin_secret_pass role:admin rooms:*

# 2. Room moderator for 'engineering' and 'operations'
user ops_lead password:moderator_password role:moderator rooms:engineering,operations

# 3. Room members
user dev_sarah password:sarah_dev_pass role:member rooms:engineering
user ops_alex password:alex_ops_pass role:member rooms:operations

# 4. Read-only room viewer
user guest_auditor password:auditor_pass role:viewer rooms:operations

# 5. IoT device: may only publish its own telemetry and read its own commands
user sensor_node password:sensor_token_77 role:device

# 6. Identity of MQTT-SN clients (see listeners.mqtt_sn.acl_user). No password: it cannot be
#    used to log in over MQTT. Every (unauthenticated) SN client gets these rights, so keep
#    them minimal: drones publish telemetry and receive commands, they never send commands.
user sn_gateway
topic write uav/+/telemetry/#
topic read uav/+/commands
topic readwrite sensors/#

# 7. Anonymous clients (only used when allow_anonymous = true)
user anonymous
topic read public/#
topic deny #
