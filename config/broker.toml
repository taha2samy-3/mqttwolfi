# ==============================================================================
# WolfMQTT Broker - Advanced Configuration File
# ==============================================================================

[broker]
# Unique identifier for this broker instance
node_id = "wolf-broker-node-01"

# Maximum number of concurrent active client connections (0 = unlimited)
max_connections = 100000

# Worker thread pool size (0 = auto-detect CPU cores)
worker_threads = 0

# ==============================================================================
# Structured Logging & Observability
# ==============================================================================
[logging]
# Log verbosity level: "trace", "debug", "info", "warn", "error"
level = "info"

# Log output format:
# - "pretty": Human-readable colored output for local development
# - "compact": High-density single-line console output
# - "json": Structured JSON output for cloud/Datadog/Elasticsearch ingest
format = "pretty"

# Include source module/target in log records
target = true

# Include OS thread IDs in log records
thread_ids = false

# Include file names and line numbers in log records
line_numbers = false

# ==============================================================================
# Network Listeners (Plain TCP and wolfSSL TLS)
# ==============================================================================
[listeners.tcp]
# Standard unencrypted MQTT listener (useful for internal LAN/debug)
enabled = true
bind_address = "0.0.0.0"
port = 1883

[listeners.tls]
# Secure encrypted MQTT listener using wolfSSL (MQTTS)
enabled = true
bind_address = "0.0.0.0"
port = 8883

# ==============================================================================
# wolfSSL Security & TLS Configuration
# ==============================================================================
[security.tls]
# Path to Trusted Root Certificate Authority (CA) file (PEM format)
ca_cert_file = "certs/ca-cert.pem"

# Path to Broker Server Certificate file (PEM format)
server_cert_file = "certs/server-cert.pem"

# Path to Broker Server Private Key file (PEM format)
server_key_file = "certs/server-key.pem"

# Enforce Mutual TLS (mTLS): Require every connecting client to present a valid certificate
require_client_cert = true

# Verify client certificate Common Name (CN) / SAN against ClientID
verify_client_identity = false

# Minimum allowed TLS protocol version: "TLSv1.2", "TLSv1.3"
min_tls_version = "TLSv1.3"

# Preferred TLS 1.3 cipher suites
ciphers = "TLS13-AES128-GCM-SHA256,TLS13-AES256-GCM-SHA384,TLS13-CHACHA20-POLY1305-SHA256"

# Application-Layer Protocol Negotiation (ALPN) protocol IDs
alpn_protocols = ["mqtt"]

# Enable Pre-Shared Key (PSK) authentication for ultra-constrained devices
psk_enabled = false
psk_identity_hint = "wolf-broker-psk"

# Enable TLS Session Resumption / Session Tickets for ultra-fast reconnects
session_tickets_enabled = true

# Lifetime of TLS session tickets in seconds
session_ticket_lifetime_sec = 7200

# Optional: Hardware Crypto acceleration engine (e.g. "none", "intel_qat", "cavium")
hardware_crypto_engine = "none"

# ==============================================================================
# Advanced MQTT Protocol Settings (v3.1.1 and v5.0)
# ==============================================================================
[mqtt.protocol]
# Enable support for MQTT v3.1.1 clients
allow_v311 = true

# Enable support for MQTT v5.0 clients
allow_v500 = true

# Maximum allowable packet size in bytes (4 MB = 4194304 bytes)
max_packet_size = 4194304

# Maximum in-flight unacknowledged QoS 1 and QoS 2 messages per client (Flow Control)
receive_maximum = 65535

# Maximum number of Topic Aliases allowed per client (MQTT 5.0)
topic_alias_maximum = 20

# Maximum allowable Keep-Alive interval in seconds (0 = follow client request)
max_keep_alive_sec = 3600

# Allow clients to subscribe using wildcards ('+' and '#')
allow_wildcard_subscriptions = true

# Allow publishers to set the RETAIN flag on messages
allow_retained_messages = true

# Allow shared subscriptions ($share/group/topic)
allow_shared_subscriptions = true

# ==============================================================================
# Memory Protection & Slow Consumer Prevention (Queue Management)
# ==============================================================================
[mqtt.queues]
# Maximum offline/in-flight message queue size per client (prevents OOM crashes)
max_queued_messages = 5000

# Maximum memory buffer allocation in bytes per client session (8 MB = 8388608 bytes)
max_queued_bytes = 8388608

# Drop policy when a slow consumer's queue is full:
# Options: "drop_oldest", "drop_newest", "reject_publisher"
queue_full_policy = "drop_oldest"

# Default message expiration time in seconds if not specified by publisher (86400 = 24h, 0 = no expiry)
default_message_expiry_sec = 86400

# Maximum session expiry interval for offline persistent sessions in seconds (7 days)
max_session_expiry_sec = 604800

# ==============================================================================
# Authentication & Authorization (AuthN / AuthZ)
# ==============================================================================
[security.auth]
# Allow anonymous clients without username/password when TLS certificate is valid
allow_anonymous = false

# Password hashing algorithm for local accounts: "sha256", "bcrypt", "argon2"
password_hash_algorithm = "sha256"

# Path to optional Access Control List (ACL) file
acl_file = "config/acl.conf"

# ==============================================================================
# System Metrics & Monitoring ($SYS Topics)
# ==============================================================================
[monitoring]
# Publish internal broker statistics to $SYS/broker/... topics
sys_topics_enabled = true

# Interval in seconds between $SYS metric updates
sys_update_interval_sec = 30
