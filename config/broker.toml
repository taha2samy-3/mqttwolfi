# ==============================================================================
# WolfiMQ broker configuration
# ==============================================================================
# Every key can be overridden from the environment:
#   WOLFIMQ_<SECTION>__<KEY>=<value>     e.g. WOLFIMQ_LISTENERS__TCP__PORT=1884
# Values are parsed as TOML literals (true, 42, ["a","b"], "text").
# The configuration file itself can be selected with WOLFIMQ_CONFIG=/path/broker.toml.
# Run `wolf-broker --print-config` to see the effective configuration.

[broker]
node_id = "wolf-broker-node-01"
# Maximum simultaneous TCP + TLS connections (0 = unlimited).
max_connections = 100000
# Tokio worker threads (0 = one per CPU core).
worker_threads = 0
# Seconds a new connection may take to send its CONNECT packet.
connect_timeout_sec = 10
# Seconds to wait for connections to close on SIGINT / SIGTERM.
shutdown_grace_sec = 5

[logging]
# trace | debug | info | warn | error   (RUST_LOG overrides this when set)
level = "info"
# pretty | compact | json
format = "pretty"
target = true
thread_ids = false
line_numbers = false

# ------------------------------------------------------------------------------
# Listeners
# ------------------------------------------------------------------------------
[listeners.tcp]
# Plain-text MQTT. Keep it on loopback or a trusted network: credentials are not encrypted.
enabled = false
bind_address = "127.0.0.1"
port = 1883

[listeners.tls]
# MQTT over wolfSSL TLS (MQTTS).
enabled = true
bind_address = "0.0.0.0"
port = 8883

[listeners.mqtt_sn]
# MQTT-SN v1.2 over UDP for sensor networks and constrained radios.
enabled = true
bind_address = "0.0.0.0"
port = 1884
gateway_id = 1
# Seconds between ADVERTISE broadcasts (0 disables them).
advertise_interval_sec = 900
advertise_address = "255.255.255.255"
# MQTT-SN v1.2 has no credentials: SN clients act as this ACL user (must exist in acl.conf).
# Empty = anonymous identity (requires security.auth.allow_anonymous = true).
acl_user = "sn_gateway"
max_sessions = 10000
# Accept connectionless QoS -1 publishes on predefined / short topic ids.
allow_qos_minus1 = true
# Retransmission of unacknowledged QoS 1/2 messages (Tretry seconds, Nretry attempts).
retry_interval_sec = 10
max_retries = 3

[listeners.mqtt_sn.predefined_topics]
"1" = "uav/drone_01/telemetry/gps"
"2" = "uav/drone_01/telemetry/battery"
"3" = "uav/drone_01/telemetry/attitude"
"10" = "uav/drone_01/commands"

# ------------------------------------------------------------------------------
# TLS (wolfSSL)
# ------------------------------------------------------------------------------
[security.tls]
ca_cert_file = "certs/ca-cert.pem"
server_cert_file = "certs/server-cert.pem"
server_key_file = "certs/server-key.pem"
# Mutual TLS: every client must present a certificate signed by ca_cert_file.
require_client_cert = true
# Require the MQTT ClientID to equal the client certificate CN or one of its SANs.
verify_client_identity = false
# "TLSv1.2" or "TLSv1.3"
min_tls_version = "TLSv1.3"
# wolfSSL cipher list (":" or "," separated). Empty = wolfSSL defaults.
ciphers = "TLS13-AES128-GCM-SHA256:TLS13-AES256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256"
alpn_protocols = ["mqtt"]
handshake_timeout_sec = 10

# ------------------------------------------------------------------------------
# Authentication & authorization
# ------------------------------------------------------------------------------
[security.auth]
# Allow clients without a user name. They use the "anonymous" account from acl.conf.
allow_anonymous = false
# Algorithm used by `wolf-broker --hash-password`: "argon2id" (recommended) or "sha256" (legacy).
password_hash_algorithm = "argon2id"
acl_file = "config/acl.conf"
# Concurrent Argon2 verifications (0 = number of CPU cores).
max_concurrent_auth = 0
# Who may take over a connected ClientID: "same_user" (default) or "any" (MQTT default behavior).
client_id_takeover = "same_user"

# ------------------------------------------------------------------------------
# MQTT protocol
# ------------------------------------------------------------------------------
[mqtt.protocol]
allow_v311 = true
allow_v500 = true
# Largest accepted packet in bytes, fixed header included.
max_packet_size = 4194304
# Unacknowledged inbound QoS 2 messages per MQTT v5.0 client.
receive_maximum = 65535
# Topic aliases a v5.0 client may use (0 disables them).
topic_alias_maximum = 20
# Upper bound announced to v5.0 clients via Server Keep Alive (0 = no limit).
max_keep_alive_sec = 3600
# Highest QoS granted: 0, 1 or 2.
maximum_qos = 2
allow_wildcard_subscriptions = true
allow_retained_messages = true
allow_shared_subscriptions = true

[mqtt.queues]
# Per-session buffer for slow or offline subscribers.
max_queued_messages = 5000
max_queued_bytes = 8388608
# "drop_oldest" or "drop_newest"
queue_full_policy = "drop_oldest"
# Drop messages without a Message Expiry Interval after waiting this long in a queue (0 = never).
default_message_expiry_sec = 0
# Upper bound for Session Expiry Interval; lifetime of MQTT v3.1.1 CleanSession=0 sessions.
max_session_expiry_sec = 86400

[mqtt.retained]
max_messages = 100000
max_bytes = 67108864

[monitoring]
# Publish broker statistics under $SYS/broker/...
sys_topics_enabled = true
sys_update_interval_sec = 30
