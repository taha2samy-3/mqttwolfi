version: '3'

env:
  RUST_LOG: "info"

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list

  check:
    desc: "Quick type-check without full build"
    cmds:
      - cargo check --all-targets

  lint:
    desc: "Run Clippy linter with strict warnings"
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    desc: "Verify source code formatting (rustfmt)"
    cmds:
      - cargo fmt -- --check

  fmt:fix:
    desc: "Auto-format Rust source files"
    cmds:
      - cargo fmt

  certs:gen:
    desc: "Generate local test PKI/mTLS certificates (Root CA, Server, Client)"
    cmds:
      - bash scripts/generate_certs.sh

  test:
    desc: "Run all primary tests (Unit + Integration)"
    deps: [test:unit, test:integration]

  test:unit:
    desc: "Run unit tests for MQTT packet parsers and protocol logic"
    cmds:
      - cargo test --lib -- --nocapture

  test:integration:
    desc: "Run integration tests (Client life cycle, Pub/Sub, QoS)"
    cmds:
      - cargo test --test '*' -- --nocapture

  test:e2e:
    desc: "Run live TCP network end-to-end socket communication tests"
    cmds:
      - cargo test --test test_e2e_network -- --nocapture

  test:all:
    desc: "Run all test suites including unit, integration, and E2E tests"
    cmds:
      - task test:unit
      - task test:integration
      - task test:e2e

  bench:
    desc: "Run high-precision performance benchmarks in release mode"
    cmds:
      - cargo bench --bench wolf-bench

  bench:tls:
    desc: "Run active TLS 1.3 / mTLS performance benchmark"
    cmds:
      - cargo run --release --bin wolf-bench-tls -- --count 5000

  bench:tls:compare:
    desc: "Run comparative TLS benchmark against other brokers (Mosquitto)"
    cmds:
      - bash scripts/run_ci_tls_benchmark.sh

  test:miri:
    desc: "Run Miri test suite to detect undefined behavior and FFI pointer safety"
    cmds:
      - cargo miri test --lib

  build:
    desc: "Compile binary in debug mode"
    cmds:
      - cargo build

  build:release:
    desc: "Compile binary in optimized release mode"
    cmds:
      - cargo build --release

  ci:
    desc: "Run full local CI pipeline (Format + Check + Lint + All Tests + E2E + Bench)"
    cmds:
      - task fmt
      - task check
      - task lint
      - task test
      - task test:e2e
      - task bench
    silent: false
