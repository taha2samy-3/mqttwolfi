version: '3'

vars:
  VERSION:
    sh: sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list

  check:
    desc: "Type-check all targets"
    cmds:
      - cargo check --all-targets

  fmt:
    desc: "Verify formatting"
    cmds:
      - cargo fmt --all -- --check

  fmt:fix:
    desc: "Format the source code"
    cmds:
      - cargo fmt --all

  lint:
    desc: "Clippy with warnings as errors"
    cmds:
      - cargo clippy --all-targets -- -D warnings

  certs:gen:
    desc: "Generate a throw-away test PKI in certs/ (CA, server, client)"
    cmds:
      - bash scripts/generate_certs.sh certs

  test:
    desc: "Unit tests plus the live TCP / TLS / MQTT-SN / CLI integration suites"
    cmds:
      - cargo test --lib --bins --tests

  test:unit:
    desc: "Unit tests only"
    cmds:
      - cargo test --lib

  test:integration:
    desc: "Integration suites only"
    cmds:
      - cargo test --tests

  bench:
    desc: "Codec / routing micro-benchmarks (release mode)"
    cmds:
      - cargo bench --bench wolf-bench

  bench:tls:
    desc: "TLS 1.3 / mTLS throughput benchmark (8 clients)"
    deps: [certs:ensure]
    cmds:
      - cargo run --release --bin wolf-bench-tls -- --concurrency 8 --count 10000

  bench:tls:compare:
    desc: "TLS benchmark side by side with a local Mosquitto, if installed"
    cmds:
      - bash scripts/run_ci_tls_benchmark.sh

  bench:report:
    desc: "Run all benchmarks and write BENCHMARKS.md (what CI publishes)"
    cmds:
      - bash scripts/ci_benchmarks.sh BENCHMARKS.md

  certs:ensure:
    internal: true
    status:
      - test -f certs/server-cert.pem
    cmds:
      - bash scripts/generate_certs.sh certs

  build:
    desc: "Debug build"
    cmds:
      - cargo build

  build:release:
    desc: "Optimized release build for this machine"
    cmds:
      - cargo build --release --bins

  build:release:fips:
    desc: "FIPS-Ready release build (requires the wolfSSL FIPS bundle, see build.rs)"
    cmds:
      - cargo build --release --no-default-features --features wolfssl-fips --bins

  build:cross:
    desc: "Cross-compile with zig, e.g. task build:cross TARGET=aarch64-unknown-linux-gnu"
    requires:
      vars: [TARGET]
    cmds:
      - rustup target add {{.TARGET}}
      - cargo zigbuild --release --target {{.TARGET}} --bins

  package:release:
    desc: "Package the native release build into dist/"
    deps: [build:release]
    vars:
      TRIPLE:
        sh: rustc -vV | sed -n 's/^host: //p'
    cmds:
      - |
        set -euo pipefail
        PKG="wolfimq-{{.VERSION}}-{{.TRIPLE}}"
        rm -rf "dist/${PKG}" && mkdir -p "dist/${PKG}/bin" "dist/${PKG}/config" "dist/${PKG}/scripts" "dist/${PKG}/docs"
        cp target/release/wolf-broker target/release/wolf-simulate target/release/wolf-bench-tls "dist/${PKG}/bin/"
        cp config/broker.toml config/acl.conf "dist/${PKG}/config/"
        cp scripts/generate_certs.sh "dist/${PKG}/scripts/"
        cp docs/*.md "dist/${PKG}/docs/"
        cp README.md CHANGELOG.md SECURITY.md LICENSE LICENSE-MIT LICENSE-APACHE "dist/${PKG}/"
        mkdir -p "dist/${PKG}/third-party/wolfssl"
        cp external/wolfssl/COPYING external/wolfssl/LICENSING "dist/${PKG}/third-party/wolfssl/"
        tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
        (cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
        echo "Created dist/${PKG}.tar.gz"

  ci:
    desc: "Local CI: format, lint, tests"
    cmds:
      - task: fmt
      - task: lint
      - task: test

  run:
    desc: "Run the broker with config/broker.toml"
    cmds:
      - cargo run --bin wolf-broker -- --config config/broker.toml

  run:debug:
    desc: "Run the broker with debug logging"
    env:
      RUST_LOG: "wolf_mqtt=debug,wolf_broker=debug,info"
    cmds:
      - cargo run --bin wolf-broker -- --config config/broker.toml

  simulate:
    desc: "Run the traffic simulator against a local broker (TCP 1883)"
    cmds:
      - cargo run --bin wolf-simulate

  simulate:tls:
    desc: "Run the traffic simulator over TLS (port 8883)"
    cmds:
      - cargo run --bin wolf-simulate -- --tls

  demo:
    desc: "Start the broker with debug logs and run the simulator against it"
    cmds:
      - bash scripts/demo_debug.sh
