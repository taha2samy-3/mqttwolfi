<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Cyan & Electric Blue Gradients -->
    <linearGradient id="wolf-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Emerald-Cyan Gradient for DTLS & MQTT-SN Wireless Telemetry -->
    <linearGradient id="sn-wireless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Shield Gradient for DTLS / TLS Cryptographic Core -->
    <linearGradient id="dtls-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- NOTE: 100% Transparent Background -->

  <!-- MQTT-SN & Radio RF Wireless Telemetry Arcs (UDP Broadcast & Drone Link) -->
  <g opacity="0.45" stroke="#00F2FE" stroke-width="3" fill="none" filter="url(#icon-glow)">
    <path d="M 100,110 A 195,195 0 0,1 412,110" stroke-dasharray="10,8"/>
    <path d="M 140,150 A 145,145 0 0,1 372,150" stroke-width="3"/>
    <path d="M 180,190 A 95,95 0 0,1 332,190" stroke-width="2.5" stroke="#38EF7D" opacity="0.7"/>
  </g>

  <!-- Wireless Sensor Satellite Nodes (MQTT-SN UAV Telemetry Nodes) -->
  <g filter="url(#soft-glow)">
    <circle cx="85" cy="180" r="4.5" fill="#38EF7D"/>
    <line x1="85" y1="180" x2="120" y2="210" stroke="#38EF7D" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <circle cx="427" cy="180" r="4.5" fill="#38EF7D"/>
    <line x1="427" y1="180" x2="392" y2="210" stroke="#38EF7D" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Central Emblem: Geometric Cyber Wolf -->
  <g transform="translate(256, 245)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="-10" r="130" fill="#00F2FE" opacity="0.16" filter="url(#icon-glow)"/>

    <!-- Left Outer Ear -->
    <polygon points="-110,-130 -40,-50 -75,-20" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5" opacity="0.95"/>
    <polygon points="-100,-115 -48,-55 -70,-35" fill="url(#wolf-neon)" opacity="0.85"/>

    <!-- Right Outer Ear -->
    <polygon points="110,-130 40,-50 75,-20" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5" opacity="0.95"/>
    <polygon points="100,-115 48,-55 70,-35" fill="url(#wolf-neon)" opacity="0.85"/>

    <!-- Crown / Forehead -->
    <polygon points="0,-100 -40,-50 0,-30" fill="#0f172a" stroke="#4FACFE" stroke-width="2.5"/>
    <polygon points="0,-100 40,-50 0,-30" fill="#1e293b" stroke="#4FACFE" stroke-width="2.5"/>

    <!-- Cryptographic Core Node -->
    <polygon points="0,-75 -20,-45 0,-20 20,-45" fill="url(#wolf-neon)" filter="url(#icon-glow)"/>
    <circle cx="0" cy="-45" r="4.5" fill="#ffffff"/>

    <!-- Cheeks & Temples -->
    <polygon points="-40,-50 -95,-10 -55,30 0,-10" fill="#0f172a" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="-95,-10 -115,20 -55,30" fill="#1e293b" stroke="#4FACFE" stroke-width="2"/>
    <polygon points="40,-50 95,-10 55,30 0,-10" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="95,-10 115,20 55,30" fill="#0f172a" stroke="#4FACFE" stroke-width="2"/>

    <!-- Luminous Cyber Eyes -->
    <polygon points="-45,-12 -20,-8 -35,3" fill="#00F2FE" filter="url(#icon-glow)"/>
    <polygon points="-42,-10 -24,-7 -34,1" fill="#FFFFFF"/>
    <polygon points="45,-12 20,-8 35,3" fill="#00F2FE" filter="url(#icon-glow)"/>
    <polygon points="42,-10 24,-7 34,1" fill="#FFFFFF"/>

    <!-- Muzzle & Snout -->
    <polygon points="0,-10 -30,40 0,65" fill="#0f172a" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="0,-10 30,40 0,65" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="0,65 -18,95 0,115" fill="#1e293b" stroke="#4FACFE" stroke-width="2.5"/>
    <polygon points="0,65 18,95 0,115" fill="#0f172a" stroke="#4FACFE" stroke-width="2.5"/>

    <!-- Nose Node -->
    <polygon points="0,60 -12,72 12,72" fill="#00F2FE"/>

    <!-- DTLS / TLS 1.3 Cryptographic Shield & Padlock Badge -->
    <g transform="translate(0, 102)" filter="url(#icon-glow)">
      <!-- Shield Emblem -->
      <path d="M 0,-14 L 17,-6 L 17,8 C 17,18 0,25 0,25 C 0,25 -17,18 -17,8 L -17,-6 Z"
            fill="url(#dtls-shield)" stroke="#00F2FE" stroke-width="2.5"/>
      <!-- Padlock Arch & Body -->
      <path d="M -5,1 L -5,-3 A 5,5 0 0,1 5,-3 L 5,1" fill="none" stroke="#00F2FE" stroke-width="2"/>
      <rect x="-6" y="1" width="12" height="9" rx="2" fill="url(#sn-wireless)"/>
      <circle cx="0" cy="5.5" r="1.5" fill="#0B132B"/>
    </g>

    <!-- Protocol Capabilities Pill Badge: MQTT-SN • DTLS • TLS -->
    <g transform="translate(0, 155)">
      <rect x="-115" y="-14" width="230" height="28" rx="14"
            fill="#090E17" stroke="url(#wolf-neon)" stroke-width="1.8" filter="url(#soft-glow)"/>
      <text x="0" y="4" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace"
            font-size="11.5" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
        <tspan fill="#38EF7D">MQTT-SN</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#00F2FE">DTLS</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#4FACFE">TLS</tspan>
      </text>
    </g>
  </g>
</svg>
