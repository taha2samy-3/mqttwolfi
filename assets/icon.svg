<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Cyan & Electric Blue Gradients -->
    <linearGradient id="wolf-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- NOTE: No Background (100% Transparent) -->

  <!-- Telemetry Arcs (MQTT Pub/Sub Signal) -->
  <g opacity="0.45" stroke="#00F2FE" stroke-width="3" fill="none" filter="url(#icon-glow)">
    <path d="M 120,130 A 180,180 0 0,1 392,130" stroke-dasharray="8,8"/>
    <path d="M 160,170 A 130,130 0 0,1 352,170" stroke-width="3.5"/>
  </g>

  <!-- Central Emblem: Geometric Cyber Wolf -->
  <g transform="translate(256, 260)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="-10" r="130" fill="#00F2FE" opacity="0.16" filter="url(#icon-glow)"/>

    <!-- Left Outer Ear -->
    <polygon points="-110,-130 -40,-50 -75,-20" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5" opacity="0.95"/>
    <polygon points="-100,-115 -48,-55 -70,-35" fill="url(#wolf-neon)" opacity="0.85"/>

    <!-- Right Outer Ear -->
    <polygon points="110,-130 40,-50 75,-20" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5" opacity="0.95"/>
    <polygon points="100,-115 48,-55 70,-35" fill="url(#wolf-neon)" opacity="0.85"/>

    <!-- Crown / Forehead -->
    <polygon points="0,-100 -40,-50 0,-30" fill="#0f172a" stroke="#4FACFE" stroke-width="2.5"/>
    <polygon points="0,-100 40,-50 0,-30" fill="#1e293b" stroke="#4FACFE" stroke-width="2.5"/>

    <!-- Cryptographic Core Node -->
    <polygon points="0,-75 -20,-45 0,-20 20,-45" fill="url(#wolf-neon)" filter="url(#icon-glow)"/>
    <circle cx="0" cy="-45" r="4.5" fill="#ffffff"/>

    <!-- Cheeks & Temples -->
    <polygon points="-40,-50 -95,-10 -55,30 0,-10" fill="#0f172a" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="-95,-10 -115,20 -55,30" fill="#1e293b" stroke="#4FACFE" stroke-width="2"/>
    <polygon points="40,-50 95,-10 55,30 0,-10" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="95,-10 115,20 55,30" fill="#0f172a" stroke="#4FACFE" stroke-width="2"/>

    <!-- Luminous Cyber Eyes -->
    <polygon points="-45,-12 -20,-8 -35,3" fill="#00F2FE" filter="url(#icon-glow)"/>
    <polygon points="-42,-10 -24,-7 -34,1" fill="#FFFFFF"/>
    <polygon points="45,-12 20,-8 35,3" fill="#00F2FE" filter="url(#icon-glow)"/>
    <polygon points="42,-10 24,-7 34,1" fill="#FFFFFF"/>

    <!-- Muzzle & Snout -->
    <polygon points="0,-10 -30,40 0,65" fill="#0f172a" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="0,-10 30,40 0,65" fill="#1e293b" stroke="#00F2FE" stroke-width="2.5"/>
    <polygon points="0,65 -18,95 0,115" fill="#1e293b" stroke="#4FACFE" stroke-width="2.5"/>
    <polygon points="0,65 18,95 0,115" fill="#0f172a" stroke="#4FACFE" stroke-width="2.5"/>

    <!-- Nose Node -->
    <polygon points="0,60 -12,72 12,72" fill="#00F2FE"/>

    <!-- wolfSSL Security Lock Badge -->
    <g transform="translate(0, 102)" filter="url(#icon-glow)">
      <circle cx="0" cy="0" r="16" fill="#0B132B" stroke="#00F2FE" stroke-width="2.5"/>
      <path d="M -6,-3 L -6,-6 A 6,6 0 0,1 6,-6 L 6,-3" fill="none" stroke="#00F2FE" stroke-width="2.5"/>
      <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="url(#wolf-neon)"/>
      <circle cx="0" cy="2.5" r="1.8" fill="#0B132B"/>
    </g>
  </g>
</svg>
