<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">WolfiMQ</title>
  <desc id="desc">MQTT 5.0, 3.1.1 and MQTT-SN broker in Rust with wolfSSL TLS 1.3</desc>
  <defs>
    <style>
      .word { fill: #0F172A; font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 112px; font-weight: 800; letter-spacing: -2px; }
      .tag { fill: #475569; font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      .chip { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1.5; }
      .chip-text { fill: #1E293B; font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 19px; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        .word { fill: #F8FAFC; }
        .tag { fill: #94A3B8; }
        .chip { fill: #1E293B; stroke: #334155; }
        .chip-text { fill: #E2E8F0; }
      }
    </style>
    <linearGradient id="shield-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <linearGradient id="shield-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Mark (same artwork as assets/icon.svg) -->
  <g transform="translate(24 30) scale(0.625)">
    <path d="M256 22 L459 139 L459 373 L256 490 L53 373 L53 139 Z" fill="url(#shield-fill)" stroke="url(#shield-edge)" stroke-width="14" stroke-linejoin="round"/>
    <g fill="none" stroke="url(#accent)" stroke-linecap="round">
      <path d="M225 122 A36 36 0 0 1 287 122" stroke-width="9"/>
      <path d="M201 108 A64 64 0 0 1 311 108" stroke-width="8" opacity="0.6"/>
    </g>
    <circle cx="256" cy="140" r="9" fill="#67E8F9"/>
    <g stroke="#0A1222" stroke-width="2" stroke-linejoin="round">
      <polygon points="150,118 226,196 138,246" fill="#1E3A5F"/>
      <polygon points="156,140 208,196 160,222" fill="#22D3EE"/>
      <polygon points="362,118 286,196 374,246" fill="#1E3A5F"/>
      <polygon points="356,140 304,196 352,222" fill="#22D3EE"/>
      <polygon points="226,196 256,172 286,196 256,268" fill="#38BDF8"/>
      <polygon points="138,246 226,196 256,268 194,292" fill="#2B5C8A"/>
      <polygon points="374,246 286,196 256,268 318,292" fill="#24507A"/>
      <polygon points="138,246 194,292 172,338" fill="#1E3A5F"/>
      <polygon points="374,246 318,292 340,338" fill="#1A3354"/>
      <polygon points="194,292 256,268 256,432 214,356" fill="#3B82F6"/>
      <polygon points="318,292 256,268 256,432 298,356" fill="#2563EB"/>
      <polygon points="172,338 194,292 214,356" fill="#2B5C8A"/>
      <polygon points="340,338 318,292 298,356" fill="#24507A"/>
    </g>
    <polygon points="198,252 234,266 206,276" fill="#ECFEFF"/>
    <polygon points="314,252 278,266 306,276" fill="#ECFEFF"/>
    <polygon points="234,390 278,390 256,416" fill="#0A1222"/>
  </g>

  <!-- Wordmark -->
  <text x="380" y="168" class="word">Wolfi<tspan fill="url(#mq)">MQ</tspan></text>
  <text x="384" y="216" class="tag">MQTT 5.0 · 3.1.1 · MQTT-SN 1.2 broker in Rust · wolfSSL TLS 1.3</text>

  <!-- Capability chips -->
  <g>
    <rect x="384" y="250" width="176" height="46" rx="23" class="chip"/>
    <text x="472" y="280" text-anchor="middle" class="chip-text">MQTT 5.0</text>
    <rect x="574" y="250" width="186" height="46" rx="23" class="chip"/>
    <text x="667" y="280" text-anchor="middle" class="chip-text">MQTT-SN UDP</text>
    <rect x="774" y="250" width="186" height="46" rx="23" class="chip"/>
    <text x="867" y="280" text-anchor="middle" class="chip-text">mTLS 1.3</text>
    <rect x="974" y="250" width="186" height="46" rx="23" class="chip"/>
    <text x="1067" y="280" text-anchor="middle" class="chip-text">RBAC / ACL</text>
  </g>
</svg>
