<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Styles for Automatic Light/Dark Mode Adaptation -->
    <style>
      .brand-title {
        fill: #0F172A;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 6px;
      }
      .brand-tagline {
        fill: #475569;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .badge-bg {
        fill: rgba(15, 23, 42, 0.06);
        stroke: rgba(15, 23, 42, 0.15);
      }
      .badge-text-green {
        fill: #059669;
      }
      .badge-text-cyan {
        fill: #0891B2;
      }
      .badge-text-blue {
        fill: #0284C7;
      }
      .badge-text-purple {
        fill: #7C3AED;
      }
      .facet-dark {
        fill: #1E293B;
      }
      .facet-deep {
        fill: #0F172A;
      }

      @media (prefers-color-scheme: dark) {
        .brand-title {
          fill: #F8FAFC;
        }
        .brand-tagline {
          fill: #94A3B8;
        }
        .badge-bg {
          fill: rgba(30, 41, 59, 0.7);
          stroke: #334155;
        }
        .badge-text-green {
          fill: #34D399;
        }
        .badge-text-cyan {
          fill: #00F2FE;
        }
        .badge-text-blue {
          fill: #38BDF8;
        }
        .badge-text-purple {
          fill: #C084FC;
        }
        .facet-dark {
          fill: #1E293B;
        }
        .facet-deep {
          fill: #0F172A;
        }
      }
    </style>

    <!-- Neon Cyan & Electric Blue Gradients -->
    <linearGradient id="wolf-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="sn-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <linearGradient id="dtls-shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- NOTE: No Background Rectangle (100% Transparent) -->

  <!-- MQTT & MQTT-SN Radiating Waves (Concentric Arcs & Radio Pulses) -->
  <g opacity="0.45" stroke="#00F2FE" stroke-width="2.5" fill="none" filter="url(#soft-glow)">
    <path d="M 230,105 A 210,210 0 0,1 570,105" stroke-dasharray="8,8"/>
    <path d="M 270,140 A 160,160 0 0,1 530,140" stroke-width="2.5"/>
    <path d="M 315,175 A 110,110 0 0,1 485,175" stroke-width="3" stroke="#38EF7D" opacity="0.8"/>
  </g>

  <!-- Central Emblem: Geometric Cyber Wolf Head & Shield -->
  <g transform="translate(400, 220)">
    <!-- Ambient Halo Glow -->
    <circle cx="0" cy="-20" r="140" fill="#00F2FE" opacity="0.14" filter="url(#glow)"/>

    <!-- Left Outer Ear -->
    <polygon points="-110,-130 -40,-50 -75,-20" class="facet-dark" stroke="#00F2FE" stroke-width="2" opacity="0.95"/>
    <!-- Left Inner Ear Neon -->
    <polygon points="-100,-115 -48,-55 -70,-35" fill="url(#wolf-primary)" opacity="0.85"/>

    <!-- Right Outer Ear -->
    <polygon points="110,-130 40,-50 75,-20" class="facet-dark" stroke="#00F2FE" stroke-width="2" opacity="0.95"/>
    <!-- Right Inner Ear Neon -->
    <polygon points="100,-115 48,-55 70,-35" fill="url(#wolf-primary)" opacity="0.85"/>

    <!-- Crown / Forehead Facets -->
    <polygon points="0,-100 -40,-50 0,-30" class="facet-deep" stroke="#4FACFE" stroke-width="2"/>
    <polygon points="0,-100 40,-50 0,-30" class="facet-dark" stroke="#4FACFE" stroke-width="2"/>

    <!-- Forehead Security Node (Cryptographic Core) -->
    <polygon points="0,-75 -20,-45 0,-20 20,-45" fill="url(#wolf-primary)" filter="url(#soft-glow)"/>
    <circle cx="0" cy="-45" r="4" fill="#ffffff"/>

    <!-- Left Cheek / Temple -->
    <polygon points="-40,-50 -95,-10 -55,30 0,-10" class="facet-deep" stroke="#00F2FE" stroke-width="2"/>
    <polygon points="-95,-10 -115,20 -55,30" class="facet-dark" stroke="#4FACFE" stroke-width="1.5"/>

    <!-- Right Cheek / Temple -->
    <polygon points="40,-50 95,-10 55,30 0,-10" class="facet-dark" stroke="#00F2FE" stroke-width="2"/>
    <polygon points="95,-10 115,20 55,30" class="facet-deep" stroke="#4FACFE" stroke-width="1.5"/>

    <!-- Luminous Cyber Eyes -->
    <polygon points="-45,-12 -20,-8 -35,3" fill="#00F2FE" filter="url(#glow)"/>
    <polygon points="-42,-10 -24,-7 -34,1" fill="#FFFFFF"/>
    <polygon points="45,-12 20,-8 35,3" fill="#00F2FE" filter="url(#glow)"/>
    <polygon points="42,-10 24,-7 34,1" fill="#FFFFFF"/>

    <!-- Snout & Bridge -->
    <polygon points="0,-10 -30,40 0,65" class="facet-deep" stroke="#00F2FE" stroke-width="2"/>
    <polygon points="0,-10 30,40 0,65" class="facet-dark" stroke="#00F2FE" stroke-width="2"/>

    <!-- Lower Jaw & Muzzle -->
    <polygon points="0,65 -18,95 0,115" class="facet-dark" stroke="#4FACFE" stroke-width="2"/>
    <polygon points="0,65 18,95 0,115" class="facet-deep" stroke="#4FACFE" stroke-width="2"/>

    <!-- Nose Node -->
    <polygon points="0,60 -12,72 12,72" fill="#00F2FE"/>

    <!-- Cryptographic DTLS & TLS Shield with Padlock Accent at Muzzle Base -->
    <g transform="translate(0, 100)" filter="url(#soft-glow)">
      <path d="M 0,-13 L 15,-5 L 15,7 C 15,16 0,22 0,22 C 0,22 -15,16 -15,7 L -15,-5 Z"
            fill="url(#dtls-shield-grad)" stroke="#00F2FE" stroke-width="2"/>
      <path d="M -4.5,1 L -4.5,-2.5 A 4.5,4.5 0 0,1 4.5,-2.5 L 4.5,1" fill="none" stroke="#00F2FE" stroke-width="1.8"/>
      <rect x="-5.5" y="1" width="11" height="8" rx="1.8" fill="url(#sn-accent)"/>
      <circle cx="0" cy="5" r="1.3" fill="#0B132B"/>
    </g>

    <!-- Dynamic Telemetry Data Particles -->
    <circle cx="-130" cy="-40" r="3" fill="#00F2FE" opacity="0.9"/>
    <circle cx="130" cy="-40" r="3" fill="#00F2FE" opacity="0.9"/>
    <circle cx="-140" cy="15" r="2.5" fill="#38EF7D" opacity="0.8"/>
    <circle cx="140" cy="15" r="2.5" fill="#38EF7D" opacity="0.8"/>
  </g>

  <!-- Typography Section -->
  <g text-anchor="middle">
    <!-- Brand Name: WolfiMQ -->
    <text x="400" y="440" class="brand-title">
      Wolfi<tspan fill="#00F2FE">MQ</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="475" class="brand-tagline">
      THE GUARDED PACK • RUST, WOLFSSL TLS/DTLS &amp; MQTT-SN BROKER
    </text>

    <!-- Protocol Badges (MQTT v5/v3, MQTT-SN, TLS 1.3 / DTLS, Tokio Async) -->
    <g transform="translate(400, 505)">
      <!-- Badge 1: MQTT v5 / v3 -->
      <rect x="-310" y="0" width="140" height="26" rx="13" class="badge-bg" stroke-width="1"/>
      <text x="-240" y="17" font-family="monospace" font-size="11" font-weight="700" class="badge-text-green">MQTT v5 / v3</text>

      <!-- Badge 2: MQTT-SN (UDP) -->
      <rect x="-155" y="0" width="145" height="26" rx="13" class="badge-bg" stroke="#00F2FE" stroke-width="1"/>
      <text x="-82" y="17" font-family="monospace" font-size="11" font-weight="700" class="badge-text-cyan">MQTT-SN (UDP)</text>

      <!-- Badge 3: TLS 1.3 / DTLS -->
      <rect x="5" y="0" width="145" height="26" rx="13" class="badge-bg" stroke="#38BDF8" stroke-width="1"/>
      <text x="78" y="17" font-family="monospace" font-size="11" font-weight="700" class="badge-text-blue">TLS 1.3 / DTLS</text>

      <!-- Badge 4: TOKIO ASYNC -->
      <rect x="165" y="0" width="145" height="26" rx="13" class="badge-bg" stroke-width="1"/>
      <text x="238" y="17" font-family="monospace" font-size="11" font-weight="700" class="badge-text-purple">TOKIO ASYNC</text>
    </g>
  </g>
</svg>
