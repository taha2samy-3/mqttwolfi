<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Cyan & Electric Blue Gradients -->
    <linearGradient id="wolf-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="wolf-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>

    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#bg-grad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.06" stroke="#00F2FE" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- MQTT Signal Radiating Waves (Concentric Arcs) -->
  <g opacity="0.25" stroke="#00F2FE" stroke-width="2" fill="none" filter="url(#soft-glow)">
    <!-- Outer wave -->
    <path d="M 230,130 A 210,210 0 0,1 570,130" stroke-dasharray="8,8"/>
    <!-- Mid wave -->
    <path d="M 270,165 A 160,160 0 0,1 530,165" stroke-width="2.5"/>
    <!-- Inner wave -->
    <path d="M 315,200 A 110,110 0 0,1 485,200" stroke-width="3"/>
  </g>

  <!-- Central Emblem: Geometric Cyber Wolf Head & Shield -->
  <g transform="translate(400, 250)">
    <!-- Ambient Halo Glow behind Wolf -->
    <circle cx="0" cy="-20" r="140" fill="#00F2FE" opacity="0.12" filter="url(#glow)"/>

    <!-- Left Outer Ear -->
    <polygon points="-110,-130 -40,-50 -75,-20" fill="#1e293b" stroke="#00F2FE" stroke-width="2" opacity="0.9"/>
    <!-- Left Inner Ear Neon -->
    <polygon points="-100,-115 -48,-55 -70,-35" fill="url(#wolf-primary)" opacity="0.8"/>

    <!-- Right Outer Ear -->
    <polygon points="110,-130 40,-50 75,-20" fill="#1e293b" stroke="#00F2FE" stroke-width="2" opacity="0.9"/>
    <!-- Right Inner Ear Neon -->
    <polygon points="100,-115 48,-55 70,-35" fill="url(#wolf-primary)" opacity="0.8"/>

    <!-- Crown / Forehead Facets -->
    <polygon points="0,-100 -40,-50 0,-30" fill="#0f172a" stroke="#4FACFE" stroke-width="2"/>
    <polygon points="0,-100 40,-50 0,-30" fill="#1e293b" stroke="#4FACFE" stroke-width="2"/>

    <!-- Forehead Security Node (Cryptographic Core) -->
    <polygon points="0,-75 -20,-45 0,-20 20,-45" fill="url(#wolf-primary)" filter="url(#soft-glow)"/>
    <circle cx="0" cy="-45" r="4" fill="#ffffff"/>

    <!-- Left Cheek / Temple -->
    <polygon points="-40,-50 -95,-10 -55,30 0,-10" fill="#0f172a" stroke="#00F2FE" stroke-width="2"/>
    <polygon points="-95,-10 -115,20 -55,30" fill="#1e293b" stroke="#4FACFE" stroke-width="1.5"/>

    <!-- Right Cheek / Temple -->
    <polygon points="40,-50 95,-10 55,30 0,-10" fill="#1e293b" stroke="#00F2FE" stroke-width="2"/>
    <polygon points="95,-10 115,20 55,30" fill="#0f172a" stroke="#4FACFE" stroke-width="1.5"/>

    <!-- Luminous Cyber Eyes (wolfSSL Protected Vision) -->
    <!-- Left Eye -->
    <polygon points="-45,-12 -20,-8 -35,3" fill="#00F2FE" filter="url(#glow)"/>
    <polygon points="-42,-10 -24,-7 -34,1" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <polygon points="45,-12 20,-8 35,3" fill="#00F2FE" filter="url(#glow)"/>
    <polygon points="42,-10 24,-7 34,1" fill="#FFFFFF"/>

    <!-- Snout & Bridge -->
    <polygon points="0,-10 -30,40 0,65" fill="#0f172a" stroke="#00F2FE" stroke-width="2"/>
    <polygon points="0,-10 30,40 0,65" fill="#1e293b" stroke="#00F2FE" stroke-width="2"/>

    <!-- Lower Jaw & Muzzle -->
    <polygon points="0,65 -18,95 0,115" fill="#1e293b" stroke="#4FACFE" stroke-width="2"/>
    <polygon points="0,65 18,95 0,115" fill="#0f172a" stroke="#4FACFE" stroke-width="2"/>

    <!-- Nose Node -->
    <polygon points="0,60 -12,72 12,72" fill="#00F2FE"/>

    <!-- Cryptographic Lock Accent at Muzzle Base -->
    <g transform="translate(0, 100)" filter="url(#soft-glow)">
      <circle cx="0" cy="0" r="14" fill="#0B132B" stroke="#00F2FE" stroke-width="2"/>
      <path d="M -5,-2 L -5,-5 A 5,5 0 0,1 5,-5 L 5,-2" fill="none" stroke="#00F2FE" stroke-width="2"/>
      <rect x="-6" y="-2" width="12" height="9" rx="2" fill="url(#wolf-primary)"/>
      <circle cx="0" cy="2.5" r="1.5" fill="#0B132B"/>
    </g>

    <!-- Dynamic Telemetry Data Particles -->
    <circle cx="-130" cy="-40" r="3" fill="#00F2FE" opacity="0.8"/>
    <circle cx="130" cy="-40" r="3" fill="#00F2FE" opacity="0.8"/>
    <circle cx="-140" cy="15" r="2" fill="#38EF7D" opacity="0.7"/>
    <circle cx="140" cy="15" r="2" fill="#38EF7D" opacity="0.7"/>
    <circle cx="-85" cy="80" r="2.5" fill="#4FACFE" opacity="0.6"/>
    <circle cx="85" cy="80" r="2.5" fill="#4FACFE" opacity="0.6"/>
  </g>

  <!-- Typography Section -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="url(#text-grad)">
      WOLF<tspan fill="#00F2FE">MQTT</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#94A3B8">
      HIGH-PERFORMANCE • RUST • WOLFSSL
    </text>

    <!-- Protocol Badges -->
    <g transform="translate(400, 535)">
      <!-- Badge 1: MQTT 5.0 / 3.1.1 -->
      <rect x="-175" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="-122" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#38EF7D">MQTT v5 / v3</text>

      <!-- Badge 2: TLS 1.3 mTLS -->
      <rect x="-55" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#00F2FE" stroke-width="1"/>
      <text x="0" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#00F2FE">TLS 1.3 mTLS</text>

      <!-- Badge 3: Zero-Copy Tokio -->
      <rect x="70" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="122" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#A855F7">TOKIO ASYNC</text>
    </g>
  </g>
</svg>
