[package]
name = "wolf-mqtt-broker"
version = "0.8.0"
edition = "2021"
authors = ["WolfMQTT Team"]
description = "MQTT v3.1.1 / v5.0 and MQTT-SN v1.2 broker in Rust with wolfSSL TLS (standard and FIPS-Ready builds)"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
build = "build.rs"
exclude = ["external/wolfssl/build", "certs/*.pem"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
# HTTP/1.1 request parsing for the WebSocket upgrade (no cryptography).
httparse = "1.10"

[build-dependencies]
cmake = "0.1.50"

[dev-dependencies]
# Independent WebSocket client implementation for interoperability tests only; it is never
# linked into the broker or the tools.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[features]
# Standard wolfSSL build (default): open-source wolfSSL from the git submodule.
default = ["wolfssl"]
wolfssl = []

# FIPS-Ready wolfSSL build (FIPS-approved algorithms only, not a CMVP-validated module).
# Requires the wolfSSL FIPS-Ready bundle; see build.rs.
# Build: cargo build --release --no-default-features --features wolfssl-fips
wolfssl-fips = ["wolfssl"]

# Optimize dependencies (notably Argon2) in debug builds so the test-suite stays fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "wolf-broker"
path = "src/main.rs"

[[bin]]
name = "wolf-bench-tls"
path = "src/bin/wolf_bench_tls.rs"

[[bin]]
name = "wolf-simulate"
path = "src/bin/wolf_simulate.rs"

[[bench]]
name = "wolf-bench"
path = "benches/bench_throughput.rs"
harness = false

[lib]
name = "wolf_mqtt"
path = "src/lib.rs"
