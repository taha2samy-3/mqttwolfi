[package]
name = "wolf-mqtt-broker"
version = "0.3.1"
edition = "2021"
authors = ["WolfMQTT Team"]
description = "High-performance, secure MQTT v3.1.1 & v5.0 broker written in Rust with native wolfSSL (standard & FIPS-Ready) TLS 1.3"
license = "MIT OR Apache-2.0"

rust-version = "1.80"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bitflags = "2.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
tokio-test = "0.4"

[features]
# Standard wolfSSL build (default)
# Full cipher suite: TLS 1.3, ChaCha20-Poly1305, AES-GCM, all ECDH curves
default = ["wolfssl"]
wolfssl = []

# FIPS-Ready wolfSSL build
# Restricts to FIPS 140-2/3 approved algorithms only:
#   ALLOWED: AES-CBC/GCM, SHA-2/3, RSA 2048+, ECC P-256/384/521, HMAC-SHA, Hash-DRBG
#   REMOVED: ChaCha20-Poly1305, MD5, DES, RC4
# Build: cargo build --no-default-features --features wolfssl-fips
# For formal CMVP validation, replace external/wolfssl with a wolfSSL FIPS validated bundle.
wolfssl-fips = ["wolfssl"]

[[bin]]
name = "wolf-broker"
path = "src/main.rs"

[[bin]]
name = "wolf-bench-tls"
path = "src/bin/wolf_bench_tls.rs"

[[bin]]
name = "wolf-simulate"
path = "src/bin/wolf_simulate.rs"

[[bench]]
name = "wolf-bench"
path = "benches/bench_throughput.rs"
harness = false

[lib]
name = "wolf_mqtt"
path = "src/lib.rs"
